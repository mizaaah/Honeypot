version: 2
updates:
  # Actions GitHub (workflows) — ça existe toujours
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Docker Cowrie — le seul Dockerfile qui existe pour l'instant
  - package-ecosystem: "docker"
    directory: "/cowrie"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
