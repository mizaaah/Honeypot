name: CI/CD Honeypot

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # --------------------------------------------------
  # Job 1 : Lint + Tests
  # --------------------------------------------------
  lint-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install ruff pytest pytest-cov
          [ -f api/requirements.txt ] && pip install -r api/requirements.txt || true
          [ -f backend/requirements.txt ] && pip install -r backend/requirements.txt || true

      - name: Lint ruff
        run: ruff check . || true

      - name: Tests unitaires
        run: pytest --cov=. --cov-report=xml -v || true

  # --------------------------------------------------
  # Job 2 : Build + Scan Trivy + Push Cowrie
  # --------------------------------------------------
  build-cowrie:
    name: Build & Scan Cowrie
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image Cowrie
        id: build-cowrie
        uses: docker/build-push-action@v7
        with:
          context: ./cowrie
          push: false
          load: true
          tags: ghcr.io/mizaaah/cowrie:latest

      - name: Scan Trivy — Cowrie
        if: steps.build-cowrie.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/mizaaah/cowrie:latest
          format: sarif
          output: trivy-cowrie.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload résultats Trivy
        if: steps.build-cowrie.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-cowrie.sarif
          category: trivy-cowrie

      - name: Push image Cowrie
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.build-cowrie.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: ./cowrie
          push: true
          tags: ghcr.io/mizaaah/cowrie:latest

  # --------------------------------------------------
  # Job 3 : Build + Scan Trivy + Push Collector
  # --------------------------------------------------
  build-collector:
    name: Build & Scan Collector
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image Collector
        id: build-collector
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: ghcr.io/mizaaah/collector:latest
        continue-on-error: true

      - name: Scan Trivy — Collector
        if: steps.build-collector.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/mizaaah/collector:latest
          format: sarif
          output: trivy-collector.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload résultats Trivy
        if: steps.build-collector.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-collector.sarif
          category: trivy-collector

      - name: Push image Collector
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.build-collector.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/mizaaah/collector:latest

  # --------------------------------------------------
  # Job 4 : Build + Scan Trivy + Push API
  # --------------------------------------------------
  build-api:
    name: Build & Scan API
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image API
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: false
          load: true
          tags: ghcr.io/mizaaah/api:latest
        continue-on-error: true

      - name: Scan Trivy — API
        if: steps.build-api.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/mizaaah/api:latest
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload résultats Trivy
        if: steps.build-api.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Push image API
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.build-api.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: ghcr.io/mizaaah/api:latest
