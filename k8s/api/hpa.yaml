apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: honeypot-api-hpa
  namespace: honeypot
  labels:
    app: honeypot-api
    tier: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: honeypot-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
