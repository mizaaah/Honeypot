apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cowrie
  namespace: honeypot
  labels:
    app: cowrie
spec:
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: cowrie
          image: ghcr.io/mizaaah/cowrie:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2222
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: cowrie-vm-svc
  namespace: honeypot
spec:
  selector:
    app: cowrie
  type: LoadBalancer
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
