apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeypot
  labels:
    app: cowrie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      containers:
        - name: cowrie
          image: ghcr.io/mizaaah/cowrie:latest
          ports:
            - containerPort: 2222
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cowrie-vm-svc
  namespace: honeypot
spec:
  selector:
    app: cowrie
  type: NodePort
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
