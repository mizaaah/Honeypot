apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeypot
  labels:
    app: cowrie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-1
      containers:
        - name: cowrie
          image: ghcr.io/mizaaah/cowrie:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2222
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: cowrie-vm-svc
  namespace: honeypot
spec:
  selector:
    app: cowrie
  type: NodePort
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
