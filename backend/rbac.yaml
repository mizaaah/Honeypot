apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-sa
  namespace: honeypot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collector-role
  namespace: honeypot
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collector-rolebinding
  namespace: honeypot
subjects:
  - kind: ServiceAccount
    name: collector-sa
    namespace: honeypot
roleRef:
  kind: Role
  name: collector-role
  apiGroup: rbac.authorization.k8s.io
